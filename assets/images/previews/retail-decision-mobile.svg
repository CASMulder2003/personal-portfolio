<svg xmlns="http://www.w3.org/2000/svg" width="320" height="500" viewBox="0 0 320 500" role="img" aria-labelledby="retail-mobile-title retail-mobile-desc">
  <title id="retail-mobile-title">Supermarket site comparison: demand and walking access</title>
  <desc id="retail-mobile-desc">For a 280-square-metre store, Emerson Park has 1,383.83 modelled weekly trips, displayed as 1,384, compared with 1,243.4, displayed as 1,243, near Elm Park. Estimated residents within the original 15-minute walking threshold are 4,517 at Emerson Park and 6,589 near Elm Park. Both sites share a zero-to-1,500 scale for trips and a separate zero-to-7,000 scale for residents. Walking counts assign whole output-area populations to reachable, network-snapped centroids at 80 metres per minute, not individual addresses. The demand model redistributes fixed origin demand and does not estimate revenue, profitability or newly created trips. Values reproduce saved coursework results.</desc>
  <rect width="320" height="500" fill="#f2ece1"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#203a43">
    <text x="20" y="29" font-size="20" font-weight="700">Demand and walking access</text>
    <text x="20" y="53" font-size="16" fill="#58666a">Havering · 280 m² store</text>

    <circle cx="31" cy="79" r="11" fill="#203a43"/>
    <text x="31" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#f8f7f3">A</text>
    <text x="52" y="85" font-size="16">Emerson Park</text>
    <circle cx="31" cy="106" r="11" fill="#9b5a38"/>
    <text x="31" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#f8f7f3">B</text>
    <text x="52" y="112" font-size="16">Near Elm Park</text>
    <path d="M20 128H300" stroke="#c7c1b6" fill="none"/>

    <text x="20" y="156" font-size="18" font-weight="700">Modelled weekly trips</text>
    <g aria-label="Emerson Park: 1,384 modelled weekly trips">
      <text x="20" y="183" font-size="16" font-weight="700">A</text>
      <text x="300" y="184" text-anchor="end" font-size="24" font-weight="700">1,384</text>
      <rect x="20" y="193" width="280" height="12" fill="#ded8cc"/>
      <rect x="20" y="193" width="258.314933" height="12" fill="#203a43" data-site="A" data-measure="weekly-trips" data-value="1383.83"/>
    </g>
    <g aria-label="Near Elm Park: 1,243 modelled weekly trips">
      <text x="20" y="227" font-size="16" font-weight="700" fill="#9b5a38">B</text>
      <text x="300" y="228" text-anchor="end" font-size="24" font-weight="700" fill="#9b5a38">1,243</text>
      <rect x="20" y="237" width="280" height="12" fill="#ded8cc"/>
      <rect x="20" y="237" width="232.101333" height="12" fill="#9b5a38" data-site="B" data-measure="weekly-trips" data-value="1243.4"/>
    </g>
    <g font-size="14" fill="#58666a"><text x="20" y="269">0</text><text x="300" y="269" text-anchor="end">1,500</text></g>

    <text x="20" y="303" font-size="18" font-weight="700">Residents in walking reach*</text>
    <text x="20" y="325" font-size="16" fill="#58666a">15-minute modelled walk</text>
    <g aria-label="Emerson Park: 4,517 residents assigned to reachable area centroids">
      <text x="20" y="350" font-size="16" font-weight="700">A</text>
      <text x="300" y="351" text-anchor="end" font-size="24" font-weight="700">4,517</text>
      <rect x="20" y="360" width="280" height="12" fill="#ded8cc"/>
      <rect x="20" y="360" width="180.68" height="12" fill="#203a43" data-site="A" data-measure="walking-residents" data-value="4517"/>
    </g>
    <g aria-label="Near Elm Park: 6,589 residents assigned to reachable area centroids">
      <text x="20" y="394" font-size="16" font-weight="700" fill="#9b5a38">B</text>
      <text x="300" y="395" text-anchor="end" font-size="24" font-weight="700" fill="#9b5a38">6,589</text>
      <rect x="20" y="404" width="280" height="12" fill="#ded8cc"/>
      <rect x="20" y="404" width="263.56" height="12" fill="#9b5a38" data-site="B" data-measure="walking-residents" data-value="6589"/>
    </g>
    <g font-size="14" fill="#58666a"><text x="20" y="436">0</text><text x="300" y="436" text-anchor="end">7,000</text></g>

    <text x="20" y="464" font-size="14" fill="#58666a">* Whole-area populations</text>
    <text x="20" y="483" font-size="14" fill="#58666a">assigned to reachable centroids.</text>
  </g>
</svg>
