<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="retail-wide-title retail-wide-desc">
  <title id="retail-wide-title">Supermarket site comparison: demand and walking access</title>
  <desc id="retail-wide-desc">For a 280-square-metre store, Emerson Park has 1,383.83 modelled weekly trips, displayed as 1,384, compared with 1,243.4, displayed as 1,243, near Elm Park. Estimated residents within the original 15-minute walking threshold are 4,517 at Emerson Park and 6,589 near Elm Park. The two parallel charts have separate zero-based scales. Walking counts assign whole output-area populations to reachable, network-snapped centroids at 80 metres per minute, not individual addresses. The demand model redistributes fixed origin demand and does not estimate revenue, profitability or newly created trips. Values reproduce saved coursework results.</desc>
  <rect width="1000" height="340" fill="#f2ece1"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#203a43">
    <text x="32" y="38" font-size="26" font-weight="700">Demand and walking access</text>
    <text x="968" y="37" text-anchor="end" font-size="17" fill="#58666a">Havering · 280 m² store</text>

    <circle cx="44" cy="69" r="12" fill="#203a43"/>
    <text x="44" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#f8f7f3">A</text>
    <text x="65" y="75" font-size="18">Emerson Park</text>
    <circle cx="294" cy="69" r="12" fill="#9b5a38"/>
    <text x="294" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#f8f7f3">B</text>
    <text x="315" y="75" font-size="18">Near Elm Park</text>
    <path d="M32 92H968M499 112V279" stroke="#c7c1b6" fill="none"/>

    <text x="32" y="123" font-size="21" font-weight="700">Modelled weekly trips</text>
    <g aria-label="Emerson Park: 1,384 modelled weekly trips">
      <text x="37" y="165" font-size="18" font-weight="700">A</text>
      <rect x="64" y="146" width="320" height="24" fill="#ded8cc"/>
      <rect x="64" y="146" width="295.217067" height="24" fill="#203a43" data-site="A" data-measure="weekly-trips" data-value="1383.83"/>
      <text x="466" y="168" text-anchor="end" font-size="27" font-weight="700">1,384</text>
    </g>
    <g aria-label="Near Elm Park: 1,243 modelled weekly trips">
      <text x="37" y="217" font-size="18" font-weight="700" fill="#9b5a38">B</text>
      <rect x="64" y="198" width="320" height="24" fill="#ded8cc"/>
      <rect x="64" y="198" width="265.258667" height="24" fill="#9b5a38" data-site="B" data-measure="weekly-trips" data-value="1243.4"/>
      <text x="466" y="220" text-anchor="end" font-size="27" font-weight="700" fill="#9b5a38">1,243</text>
    </g>
    <path d="M64 248H384M64 248V253M224 248V253M384 248V253" stroke="#9a9f96" fill="none"/>
    <g font-size="16" fill="#58666a">
      <text x="64" y="275">0</text><text x="224" y="275" text-anchor="middle">750</text><text x="384" y="275" text-anchor="end">1,500</text>
    </g>

    <text x="531" y="123" font-size="21" font-weight="700">Residents within a 15-minute walk*</text>
    <g aria-label="Emerson Park: 4,517 residents assigned to reachable area centroids">
      <text x="533" y="165" font-size="18" font-weight="700">A</text>
      <rect x="560" y="146" width="320" height="24" fill="#ded8cc"/>
      <rect x="560" y="146" width="206.491429" height="24" fill="#203a43" data-site="A" data-measure="walking-residents" data-value="4517"/>
      <text x="968" y="168" text-anchor="end" font-size="27" font-weight="700">4,517</text>
    </g>
    <g aria-label="Near Elm Park: 6,589 residents assigned to reachable area centroids">
      <text x="533" y="217" font-size="18" font-weight="700" fill="#9b5a38">B</text>
      <rect x="560" y="198" width="320" height="24" fill="#ded8cc"/>
      <rect x="560" y="198" width="301.211429" height="24" fill="#9b5a38" data-site="B" data-measure="walking-residents" data-value="6589"/>
      <text x="968" y="220" text-anchor="end" font-size="27" font-weight="700" fill="#9b5a38">6,589</text>
    </g>
    <path d="M560 248H880M560 248V253M720 248V253M880 248V253" stroke="#9a9f96" fill="none"/>
    <g font-size="16" fill="#58666a">
      <text x="560" y="275">0</text><text x="720" y="275" text-anchor="middle">3,500</text><text x="880" y="275" text-anchor="end">7,000</text>
    </g>

    <text x="32" y="320" font-size="16" fill="#58666a">* Whole-area populations assigned to reachable centroids.</text>
    <text x="968" y="320" text-anchor="end" font-size="15" fill="#58666a">Separate zero-based scales</text>
  </g>
</svg>
