<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Comparison of field observations at Soldier Field and Wrigleyville</title><desc id="desc">A newly typeset evidence summary, not an original photograph or map. Chicago Field Report pages 12 to 14 describe limited commercial activity at Soldier Field, commercial activity and branding around Wrigley Field, and informal conversations with staff. These observations inform interpretation, not representative claims about community benefit.</desc>
<rect width="720" height="420" fill="#f3efe6"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" font-size="25" fill="#173344" font-weight="600" text-anchor="start">Stadium districts in Chicago</text><text x="32" y="69" font-size="17" fill="#576977" font-weight="400" text-anchor="start">Field observations and informal conversations · 2025</text><rect x="32" y="103" width="312" height="232" rx="2" fill="#e6e2d9"/><rect x="32" y="103" width="312" height="4" fill="#a46645"/><text x="52" y="147" font-size="23" fill="#173344" font-weight="600" text-anchor="start">Soldier Field</text><text x="52" y="190" font-size="17" fill="#173344" font-weight="400" text-anchor="start">Limited commercial activity</text><text x="52" y="219" font-size="17" fill="#173344" font-weight="400" text-anchor="start">observed around the stadium.</text><text x="52" y="248" font-size="17" fill="#173344" font-weight="400" text-anchor="start">Staff conversations prompted</text><text x="52" y="277" font-size="17" fill="#173344" font-weight="400" text-anchor="start">questions about ownership.</text><rect x="376" y="103" width="312" height="232" rx="2" fill="#e6e2d9"/><rect x="376" y="103" width="312" height="4" fill="#173344"/><text x="396" y="147" font-size="23" fill="#173344" font-weight="600" text-anchor="start">Wrigleyville</text><text x="396" y="190" font-size="17" fill="#173344" font-weight="400" text-anchor="start">Shops, branding and activity</text><text x="396" y="219" font-size="17" fill="#173344" font-weight="400" text-anchor="start">extended beyond the stadium.</text><text x="396" y="248" font-size="17" fill="#173344" font-weight="400" text-anchor="start">Staff described tourism and</text><text x="396" y="277" font-size="17" fill="#173344" font-weight="400" text-anchor="start">neighbourhood change.</text><text x="32" y="374" font-size="18" fill="#173344" font-weight="600" text-anchor="start">Comparison of situated observations</text><text x="32" y="400" font-size="16" fill="#576977" font-weight="400" text-anchor="start">Not a representative assessment of redevelopment impacts.</text></g></svg>